<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAV Assistant - CibleSkin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #86868b; margin-bottom: 2rem; }
        .card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .channel-selector { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .channel-btn { flex: 1; padding: 0.75rem; border: 2px solid #e5e5e7; border-radius: 8px; background: white; cursor: pointer; font-size: 0.9rem; text-align: center; transition: all 0.2s; }
        .channel-btn.active { border-color: #0071e3; background: #f0f7ff; color: #0071e3; font-weight: 600; }
        .channel-btn:hover { border-color: #0071e3; }
        textarea { width: 100%; min-height: 150px; padding: 1rem; border: 2px solid #e5e5e7; border-radius: 8px; font-size: 1rem; font-family: inherit; resize: vertical; }
        textarea:focus { outline: none; border-color: #0071e3; }
        .context-input { min-height: 60px; margin-bottom: 1rem; }
        .btn-generate { display: block; width: 100%; padding: 1rem; background: #0071e3; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-generate:hover { background: #0062c4; }
        .btn-generate:disabled { background: #86868b; cursor: not-allowed; }
        .response-box { background: #fafafa; border: 1px solid #e5e5e7; border-radius: 8px; padding: 1.5rem; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; min-height: 100px; }
        .loading { text-align: center; color: #86868b; padding: 2rem; }
        .loading::after { content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid #86868b; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; }
        .badge-email { background: #e8f5e9; color: #2e7d32; }
        .badge-dm { background: #fce4ec; color: #c62828; }
        .badge-comment { background: #fff3e0; color: #e65100; }
        .copy-btn { padding: 0.5rem 1rem; background: #f5f5f7; border: 1px solid #e5e5e7; border-radius: 6px; cursor: pointer; font-size: 0.85rem; float: right; }
        .copy-btn:hover { background: #e5e5e7; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SAV Assistant</h1>
        <p class="subtitle">CibleSkin - Service Client IA</p>

        <div class="card">
            <label>Canal de reponse</label>
            <div class="channel-selector">
                <button class="channel-btn active" data-channel="email" onclick="selectChannel(this)">Email</button>
                <button class="channel-btn" data-channel="instagram_dm" onclick="selectChannel(this)">Instagram DM</button>
                <button class="channel-btn" data-channel="instagram_comment" onclick="selectChannel(this)">Instagram Commentaire</button>
            </div>

            <label for="context">Contexte (optionnel)</label>
            <textarea id="context" class="context-input" placeholder="Infos supplementaires : numero de commande, historique client, notes internes..."></textarea>

            <label for="message">Message du client</label>
            <textarea id="message" placeholder="Collez ici le message du client..."></textarea>

            <br><br>
            <button class="btn-generate" id="generateBtn" onclick="generateResponse()">Generer la reponse</button>
        </div>

        <div class="card hidden" id="responseCard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <span class="badge" id="channelBadge"></span>
                <button class="copy-btn" onclick="copyResponse()">Copier</button>
            </div>
            <div class="response-box" id="responseBox"></div>
        </div>
    </div>

    <script>
        let currentChannel = 'email';

        function selectChannel(btn) {
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentChannel = btn.dataset.channel;
        }

        async function generateResponse() {
            const message = document.getElementById('message').value.trim();
            if (!message) { alert('Veuillez entrer un message client.'); return; }

            const btn = document.getElementById('generateBtn');
            const responseCard = document.getElementById('responseCard');
            const responseBox = document.getElementById('responseBox');
            const badge = document.getElementById('channelBadge');

            btn.disabled = true;
            btn.textContent = 'Generation en cours...';
            responseCard.classList.remove('hidden');
            responseBox.innerHTML = '<div class="loading">Claude analyse le message et redige la reponse</div>';

            const badgeClasses = { email: 'badge-email', instagram_dm: 'badge-dm', instagram_comment: 'badge-comment' };
            const badgeLabels = { email: 'Email', instagram_dm: 'Instagram DM', instagram_comment: 'Commentaire public' };
            badge.className = 'badge ' + (badgeClasses[currentChannel] || 'badge-email');
            badge.textContent = badgeLabels[currentChannel] || currentChannel;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        channel: currentChannel,
                        context: document.getElementById('context').value.trim(),
                    }),
                });

                const data = await res.json();
                if (data.error) {
                    responseBox.textContent = 'Erreur : ' + data.error;
                } else {
                    responseBox.textContent = data.response;
                }
            } catch (err) {
                responseBox.textContent = 'Erreur de connexion : ' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generer la reponse';
            }
        }

        function copyResponse() {
            const text = document.getElementById('responseBox').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copie !';
                setTimeout(() => btn.textContent = 'Copier', 1500);
            });
        }
    </script>
</body>
</html>
